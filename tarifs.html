<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarifs — DIVINE DOGS</title>
<meta name="description" content="Les tarifs de Divine Dogs : bilan comportemental, séances d'éducation, rééducation, chiot. Paiement en plusieurs fois sans frais. Questions fréquentes.">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Inter:wght@300;400;500;600;700&family=Zalando+Sans+SemiExpanded:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="loading" class="loading-state"><div class="spinner"></div><p>DIVINE DOGS</p></div>
<div id="announce-slot"></div>
<nav id="nav"></nav>
<main id="main"></main>
<footer id="footer"></footer>
<div id="extras"></div>

<script src="assets/js/icons.js" defer></script>
<script src="assets/js/render.js" defer></script>
<script src="assets/js/main.js" defer></script>
<script defer>
document.addEventListener('DOMContentLoaded', async () => {
  const ready = () => window.DD_RENDER && window.DD_BEHAVIORS;
  while (!ready()) await new Promise(r => setTimeout(r, 30));

  const R = window.DD_RENDER, B = window.DD_BEHAVIORS;
  const data = await B.loadData();
  if (!data) return;
  window.DD_LANG = B.getStoredLang() || data.defaultLang || 'fr';
  window.DD_DATA = data;

  function render() {
    R.meta(data);
    if (data.theme) R.theme(data.theme);
    const L = R.lang(data);
    const tp = (data.tarifsPage && data.tarifsPage[L]) || (data.tarifsPage && data.tarifsPage.fr) || {};
    const contact = R.lang(data, 'nav').links?.find(x => x.id === 'contact');

    document.getElementById('announce-slot').innerHTML = R.announce(data);
    document.getElementById('nav').innerHTML = R.nav(data, 'tarifs');
    document.getElementById('footer').innerHTML = R.footer(data);
    document.getElementById('extras').innerHTML = R.backTop();

    const rows = (tp.grid || []).map(t => `
      <div class="tarif-row reveal">
        <div class="tarif-info">
          <div class="tarif-name">${R.esc(t.name)}</div>
          ${t.note ? `<div class="tarif-note">${R.esc(t.note)}</div>` : ''}
        </div>
        <div class="tarif-price">${R.esc(t.price)}</div>
      </div>`).join('');

    const faq = (tp.faq || []).map((item, i) => `
      <div class="accordion" id="faq${i}">
        <div class="accordion-header" onclick="document.getElementById('faq${i}').classList.toggle('open')">
          <h2 class="accordion-title">${R.esc(item.q)}</h2>
          <span class="accordion-icon">${window.icon('chevronDown', 16)}</span>
        </div>
        <div class="accordion-body"><div class="accordion-content">
          <p>${R.highlightWords(item.a, item.aHighlights || [])}</p>
        </div></div>
      </div>`).join('');

    document.getElementById('main').innerHTML = `
      <section class="subhero">
        <span class="section-eyebrow">${R.esc(tp.eyebrow || '')}</span>
        <h1>${R.highlightWords(tp.title || '', tp.highlights || [])}</h1>
      </section>
      <section class="section">
        ${tp.paymentInfo ? `<div class="tarifs-payment reveal">${R.esc(tp.paymentInfo)}</div>` : ''}
        <div class="tarifs-grid">${rows}</div>
        ${tp.forfaits ? `<div class="tarifs-forfaits reveal">${R.highlightWords(tp.forfaits, tp.forfaitsHighlights || [])}</div>` : ''}
        ${contact ? `<div class="services-cta"><a href="${R.esc(contact.anchor)}" class="btn btn-primary">${R.esc(contact.label)} ${window.icon('arrowRight', 16)}</a></div>` : ''}
      </section>
      <section class="section tarifs-faq">
        <div class="container">
          <div class="testimonials-header reveal" style="text-align:center;margin-bottom:2rem">
            <h2 class="section-title">${R.highlightWords(tp.faqTitle || 'Questions sur les tarifs', tp.faqHighlights || [])}</h2>
          </div>
          <div class="faq-list">${faq}</div>
        </div>
      </section>`;

    requestAnimationFrame(() => B.attachCommon(data, { onLangChange: render }));
  }

  render();
  requestAnimationFrame(() => B.hideLoading());
});
</script>
</body>
</html>
